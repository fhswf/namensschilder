name: Namensschilder als PDF
description: Erzeugt eine A4-PDF-Druckvorlage für gefaltete Namensschilder aus einer CSV-Datei.
author: Christian Gawron

branding:
  icon: tag
  color: purple

inputs:
  csv:
    description: Pfad zur semikolongetrennten CSV-Datei im aufrufenden Repository.
    required: true
  banner:
    description: Pfad zur Banner-SVG-Datei im aufrufenden Repository.
    required: true
  logos:
    description: JSON-Array mit Pfaden zu den Logo-SVG-Dateien im aufrufenden Repository.
    required: true
  output:
    description: Pfad der erzeugten PDF-Datei, relativ zum Workspace.
    required: false
    default: namensschilder.pdf
  qr-text:
    description: Globaler Fallback-Text für QR-Codes, wenn die CSV keine QR-Text-Spalte enthält.
    required: false
  qr-label:
    description: Beschriftung unter dem QR-Code.
    required: false
    default: Gastzugang WLAN
  no-qr:
    description: QR-Code und QR-Beschriftung ausblenden.
    required: false
    default: "false"
  no-rotate-back:
    description: Die zweite Schildhälfte nicht um 180 Grad drehen.
    required: false
    default: "false"
  fo:
    description: Optionaler Pfad, unter dem zusätzlich die XSL-FO-Datei gespeichert wird.
    required: false

outputs:
  pdf:
    description: Pfad zur erzeugten PDF-Datei relativ zum Workspace.

runs:
  using: docker
  image: docker://ghcr.io/fhswf/namensschilder:v1.0.2
  args:
    - ${{ inputs.csv }}
    - ${{ inputs.banner }}
    - ${{ inputs.logos }}
    - ${{ inputs.output }}
    - ${{ inputs.qr-text }}
    - ${{ inputs.qr-label }}
    - ${{ inputs.no-qr }}
    - ${{ inputs.no-rotate-back }}
    - ${{ inputs.fo }}
